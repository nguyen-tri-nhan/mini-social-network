%dev.quarkus.http.port=8086

quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.interaction-events-in.connector=smallrye-kafka
mp.messaging.incoming.interaction-events-in.topic=social.interaction
mp.messaging.incoming.interaction-events-in.group.id=ws-group
mp.messaging.incoming.interaction-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.interaction-events-in.auto.offset.reset=earliest

app.service-code=06

quarkus.container-image.group=nhan
quarkus.container-image.name=websocket-service
quarkus.container-image.tag=latest
quarkus.jib.base-jvm-image=eclipse-temurin:21-jre-alpine
%prod.quarkus.container-image.registry=${ECR_REGISTRY:}

quarkus.index-dependency.social-exception.group-id=com.nhan.social
quarkus.index-dependency.social-exception.artifact-id=social-exception

quarkus.jackson.serialization-inclusion=non-null
quarkus.log.level=INFO
quarkus.log.category."com.nhan".level=DEBUG

# ── Observability ─────────────────────────────────────────────────────────────
quarkus.application.name=websocket-service
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.exporter=otlp

# JSON structured logging → Loki
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
%dev.quarkus.log.console.json=false
