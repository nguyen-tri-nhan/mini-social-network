%dev.quarkus.http.port=8086

quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# JWT — verify cục bộ như mọi service khác (ADR 0005). Browser không set được header
# Authorization cho WebSocket → token đi qua Sec-WebSocket-Protocol, Quarkus chuyển thành
# header Authorization trước khi xác thực upgrade (ADR 0009).
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:public-key.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://social.nhan.dev}
quarkus.websockets-next.server.supported-subprotocols=bearer-token-carrier
quarkus.websockets-next.server.propagate-subprotocol-headers=true

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.interaction-events-in.connector=smallrye-kafka
mp.messaging.incoming.interaction-events-in.topic=social.interaction
mp.messaging.incoming.interaction-events-in.group.id=ws-group
mp.messaging.incoming.interaction-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.interaction-events-in.auto.offset.reset=earliest

mp.messaging.incoming.user-events-in.connector=smallrye-kafka
mp.messaging.incoming.user-events-in.topic=social.user
mp.messaging.incoming.user-events-in.group.id=ws-user-group
mp.messaging.incoming.user-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.user-events-in.auto.offset.reset=earliest

# Tin nhắn: latest — tin cũ đã có trong lịch sử REST, replay lại chỉ gây push trùng.
mp.messaging.incoming.chat-events-in.connector=smallrye-kafka
mp.messaging.incoming.chat-events-in.topic=social.chat
mp.messaging.incoming.chat-events-in.group.id=ws-chat-group
mp.messaging.incoming.chat-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.chat-events-in.auto.offset.reset=latest

# KMS (LocalStack) — unwrap DEK để giải mã tin trước khi push (ADR 0007).
quarkus.kms.aws.region=${AWS_REGION:us-east-1}
quarkus.kms.aws.credentials.type=static
quarkus.kms.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.kms.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
quarkus.kms.endpoint-override=${KMS_ENDPOINT:http://localhost:4566}
app.chat.kms-key-id=${CHAT_KMS_KEY_ID:alias/social-chat}

app.service-code=06

quarkus.container-image.group=nhan
quarkus.container-image.name=websocket-service
quarkus.container-image.tag=latest
quarkus.jib.base-jvm-image=eclipse-temurin:21-jre-alpine
%prod.quarkus.container-image.registry=${ECR_REGISTRY:}

quarkus.index-dependency.social-exception.group-id=com.nhan.social
quarkus.index-dependency.social-exception.artifact-id=social-exception
quarkus.index-dependency.chat-crypto.group-id=com.nhan.social
quarkus.index-dependency.chat-crypto.artifact-id=chat-crypto

quarkus.jackson.serialization-inclusion=non-null
quarkus.log.level=INFO
quarkus.log.category."com.nhan".level=DEBUG

# ── Observability ─────────────────────────────────────────────────────────────
quarkus.application.name=websocket-service
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true
quarkus.otel.logs.enabled=true

# JSON structured logging → Loki
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
%dev.quarkus.log.console.json=false
