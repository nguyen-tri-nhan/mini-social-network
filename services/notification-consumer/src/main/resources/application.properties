%dev.quarkus.http.port=8185

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/social}

quarkus.liquibase.migrate-at-start=false

quarkus.hibernate-orm.database.default-schema=notification

quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.social-events-in.connector=smallrye-kafka
mp.messaging.incoming.social-events-in.topic=social.events
mp.messaging.incoming.social-events-in.group.id=notification-group
mp.messaging.incoming.social-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.social-events-in.auto.offset.reset=earliest

app.service-code=05

quarkus.container-image.group=nhan
quarkus.container-image.name=notification-consumer
quarkus.container-image.tag=latest
quarkus.jib.base-jvm-image=eclipse-temurin:21-jre-alpine
%prod.quarkus.container-image.registry=${ECR_REGISTRY:}

quarkus.index-dependency.social-exception.group-id=com.nhan.social
quarkus.index-dependency.social-exception.artifact-id=social-exception
quarkus.index-dependency.notification-service.group-id=com.nhan.social
quarkus.index-dependency.notification-service.artifact-id=notification-service
quarkus.index-dependency.notification-service-dao.group-id=com.nhan.social
quarkus.index-dependency.notification-service-dao.artifact-id=notification-service-dao

quarkus.jackson.serialization-inclusion=non-null
quarkus.log.level=INFO
quarkus.log.category."com.nhan".level=DEBUG

# ── Observability ─────────────────────────────────────────────────────────────
quarkus.application.name=notification-consumer
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.exporter=otlp

# JSON structured logging → Loki
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
%dev.quarkus.log.console.json=false
