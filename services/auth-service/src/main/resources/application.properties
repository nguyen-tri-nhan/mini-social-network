%dev.quarkus.http.port=8081

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/social}

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.liquibase.default-schema-name=auth

# Hibernate schema
quarkus.hibernate-orm.database.default-schema=auth

# JWT — sign (auth-service only)
smallrye.jwt.sign.key.location=${SMALLRYE_JWT_SIGN_KEY_LOCATION:private-key.pem}
mp.jwt.verify.publickey.location=public-key.pem
mp.jwt.verify.issuer=${JWT_ISSUER:https://social.nhan.dev}

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Jackson
quarkus.jackson.serialization-inclusion=non-null

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.nhan".level=DEBUG

# Container image (Jib — no Dockerfile needed)
quarkus.container-image.group=nhan
quarkus.container-image.name=auth-service
quarkus.container-image.tag=latest
quarkus.jib.base-jvm-image=eclipse-temurin:21-jre-alpine
%prod.quarkus.container-image.registry=${ECR_REGISTRY:}
# Build: ./gradlew :auth-service:build -Dquarkus.container-image.build=true
# Push:  ./gradlew :auth-service:build -Dquarkus.container-image.push=true

# Bean discovery for social-exception mappers
quarkus.index-dependency.social-exception.group-id=com.nhan.social
quarkus.index-dependency.social-exception.artifact-id=social-exception
quarkus.index-dependency.auth-service-dao.group-id=com.nhan.social
quarkus.index-dependency.auth-service-dao.artifact-id=auth-service-dao

# Service identity
app.service-code=01

# ── Observability ─────────────────────────────────────────────────────────────
quarkus.application.name=auth-service
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true
quarkus.otel.logs.enabled=true

# JSON structured logging → Loki
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
%dev.quarkus.log.console.json=false

# ── OpenAPI / Swagger — trang tổng hợp, xem specs/decisions/0001 ─────────────
quarkus.swagger-ui.always-include=true

%dev.quarkus.swagger-ui.urls.auth=http://localhost:8081/q/openapi
%dev.quarkus.swagger-ui.urls.user=http://localhost:8082/openapi/users
%dev.quarkus.swagger-ui.urls.post=http://localhost:8083/openapi/post
%dev.quarkus.swagger-ui.urls.interaction=http://localhost:8084/openapi/interaction
%dev.quarkus.swagger-ui.urls.notification=http://localhost:8085/openapi/notifications
%dev.quarkus.swagger-ui.urls-primary-name=auth

%prod.quarkus.swagger-ui.urls.auth=/q/openapi
%prod.quarkus.swagger-ui.urls.user=/openapi/users
%prod.quarkus.swagger-ui.urls.post=/openapi/post
%prod.quarkus.swagger-ui.urls.interaction=/openapi/interaction
%prod.quarkus.swagger-ui.urls.notification=/openapi/notifications
%prod.quarkus.swagger-ui.urls-primary-name=auth
