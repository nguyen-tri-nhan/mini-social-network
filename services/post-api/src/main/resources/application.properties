%dev.quarkus.http.port=8083

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/social}

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.liquibase.default-schema-name=post

quarkus.hibernate-orm.database.default-schema=post

# JWT
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:public-key.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://social.nhan.dev}

# Redis
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# S3 / LocalStack
quarkus.s3.aws.region=${AWS_REGION:us-east-1}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
%dev.quarkus.s3.endpoint-override=${S3_ENDPOINT:http://localhost:4566}
app.s3.bucket=${S3_BUCKET:social-images}
app.s3.public-url=${S3_PUBLIC_URL:http://localhost:4566/social-images}

# Kafka outgoing (article.created)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.social-events-out.connector=smallrye-kafka
mp.messaging.outgoing.social-events-out.topic=social.events
mp.messaging.outgoing.social-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Service identity
app.service-code=03

# Container image
quarkus.container-image.group=nhan
quarkus.container-image.name=post-api
quarkus.container-image.tag=latest
quarkus.jib.base-jvm-image=eclipse-temurin:21-jre-alpine
%prod.quarkus.container-image.registry=${ECR_REGISTRY:}

# Bean discovery for shared libs
quarkus.index-dependency.social-exception.group-id=com.nhan.social
quarkus.index-dependency.social-exception.artifact-id=social-exception
quarkus.index-dependency.post-service.group-id=com.nhan.social
quarkus.index-dependency.post-service.artifact-id=post-service
quarkus.index-dependency.post-service-dao.group-id=com.nhan.social
quarkus.index-dependency.post-service-dao.artifact-id=post-service-dao

quarkus.jackson.serialization-inclusion=non-null
quarkus.log.level=INFO
quarkus.log.category."com.nhan".level=DEBUG

# ── Observability ─────────────────────────────────────────────────────────────
quarkus.application.name=post-api
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.exporter=otlp

# JSON structured logging → Loki
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
%dev.quarkus.log.console.json=false
