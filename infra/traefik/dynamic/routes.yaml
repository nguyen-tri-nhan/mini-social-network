http:

  # ── Middleware ──────────────────────────────────────────────────────────────
  middlewares:

    jwt-verify:
      forwardAuth:
        address: "http://host.docker.internal:8081/api/auth/verify"
        authResponseHeaders:
          - X-User-Id

  # ── Routers ────────────────────────────────────────────────────────────────
  routers:

    # Public — no auth
    auth:
      rule: "PathPrefix(`/api/auth`)"
      service: auth
      entryPoints: [web]

    # Protected — jwt-verify attached per route
    users:
      rule: "PathPrefix(`/api/users`)"
      service: users
      entryPoints: [web]
      middlewares: [jwt-verify]

    post:
      rule: "PathPrefix(`/api/articles`)"
      service: post
      entryPoints: [web]
      middlewares: [jwt-verify]

    comments:
      rule: "PathPrefix(`/api/comments`)"
      service: interaction
      entryPoints: [web]
      middlewares: [jwt-verify]

    votes:
      rule: "PathPrefix(`/api/votes`)"
      service: interaction
      entryPoints: [web]
      middlewares: [jwt-verify]

    notifications:
      rule: "PathPrefix(`/api/notifications`)"
      service: notifications
      entryPoints: [web]
      middlewares: [jwt-verify]

    websocket:
      rule: "PathPrefix(`/ws`)"
      service: websocket
      entryPoints: [web]

    # API Docs — Swagger UI gộp, xem specs/decisions/0001
    docs:
      rule: "PathPrefix(`/q`)"
      service: auth
      entryPoints: [web]

    openapi-users:
      rule: "PathPrefix(`/openapi/users`)"
      service: users
      entryPoints: [web]

    openapi-post:
      rule: "PathPrefix(`/openapi/post`)"
      service: post
      entryPoints: [web]

    openapi-interaction:
      rule: "PathPrefix(`/openapi/interaction`)"
      service: interaction
      entryPoints: [web]

    openapi-notifications:
      rule: "PathPrefix(`/openapi/notifications`)"
      service: notifications
      entryPoints: [web]

  # ── Services ───────────────────────────────────────────────────────────────
  services:

    auth:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8081"

    users:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8082"

    post:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8083"

    interaction:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8084"

    notifications:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8085"

    websocket:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8086"
