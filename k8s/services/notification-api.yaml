apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: social
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-api }
  template:
    metadata:
      labels: { app: notification-api }
    spec:
      containers:
        - name: notification-api
          image: nhan/notification-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://lgtm:4317
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/social
            - name: REDIS_URL
              value: redis://redis:6379
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: JWT_ISSUER
              value: https://social.nhan.dev
            - name: JWT_PUBLIC_KEY_LOCATION
              value: /etc/jwt/public-key.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: social
spec:
  selector: { app: notification-api }
  ports:
    - port: 8080
