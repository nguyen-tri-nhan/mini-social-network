apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: social
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka-connect }
  template:
    metadata:
      labels: { app: kafka-connect }
    spec:
      containers:
        - name: kafka-connect
          image: debezium/connect:2.7
          ports:
            - containerPort: 8083
          env:
            - { name: BOOTSTRAP_SERVERS,        value: kafka:9092 }
            - { name: GROUP_ID,                  value: debezium-connect }
            - { name: CONFIG_STORAGE_TOPIC,      value: debezium.configs }
            - { name: OFFSET_STORAGE_TOPIC,      value: debezium.offsets }
            - { name: STATUS_STORAGE_TOPIC,      value: debezium.status }
            - { name: KEY_CONVERTER,             value: org.apache.kafka.connect.json.JsonConverter }
            - { name: VALUE_CONVERTER,           value: org.apache.kafka.connect.json.JsonConverter }
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: social
spec:
  selector: { app: kafka-connect }
  ports:
    - port: 8083

---
# Job chạy 1 lần để đăng ký PostgreSQL connector sau khi kafka-connect up
apiVersion: batch/v1
kind: Job
metadata:
  name: register-debezium-connector
  namespace: social
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-connect
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              until curl -sf http://kafka-connect:8083/connectors; do
                echo "Waiting for kafka-connect..."; sleep 5
              done
      containers:
        - name: register
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              curl -sf -X POST http://kafka-connect:8083/connectors \
                -H "Content-Type: application/json" \
                -d '{
                  "name": "social-outbox-connector",
                  "config": {
                    "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
                    "database.hostname": "postgres",
                    "database.port": "5432",
                    "database.user": "postgres",
                    "database.password": "postgres",
                    "database.dbname": "social",
                    "topic.prefix": "social",
                    "plugin.name": "pgoutput",
                    "table.include.list": "interaction.outbox,post.outbox,auth.outbox",
                    "transforms": "outbox",
                    "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
                    "transforms.outbox.table.field.event.id": "id",
                    "transforms.outbox.table.field.event.key": "aggregate_id",
                    "transforms.outbox.table.field.event.type": "event_type",
                    "transforms.outbox.table.field.event.payload": "payload",
                    "transforms.outbox.route.by.field": "aggregate_type",
                    "transforms.outbox.route.topic.replacement": "social.${routedByValue}",
                    "tombstones.on.delete": "false"
                  }
                }'
              echo "Connector registered"
