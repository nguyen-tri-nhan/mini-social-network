apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: social
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka-connect }
  template:
    metadata:
      labels: { app: kafka-connect }
    spec:
      containers:
        - name: kafka-connect
          image: debezium/connect:2.7.3.Final
          ports:
            - containerPort: 8083
          env:
            - { name: BOOTSTRAP_SERVERS,        value: kafka:9092 }
            - { name: GROUP_ID,                  value: debezium-connect }
            - { name: CONFIG_STORAGE_TOPIC,      value: debezium.configs }
            - { name: OFFSET_STORAGE_TOPIC,      value: debezium.offsets }
            - { name: STATUS_STORAGE_TOPIC,      value: debezium.status }
            - { name: KEY_CONVERTER,             value: org.apache.kafka.connect.json.JsonConverter }
            - { name: VALUE_CONVERTER,           value: org.apache.kafka.connect.json.JsonConverter }
            # entrypoint image chỉ đặc cách 1 danh sách cố định biến không
            # tiền tố (BOOTSTRAP_SERVERS, GROUP_ID, *_STORAGE_TOPIC,
            # KEY_CONVERTER, VALUE_CONVERTER...) — mọi property khác BẮT
            # BUỘC tiền tố CONNECT_ mới được map vào connect-distributed
            # .properties (CONNECT_X_Y_Z -> x.y.z). Thiếu tiền tố này khiến
            # 2 dòng dưới bị bỏ qua hoàn toàn trước đây, worker chạy với
            # default schemas.enable=true -> consumer nhận thêm envelope
            # {schema,payload} bọc ngoài SocialEvent, deserialize vỡ.
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            # LƯU Ý: image này KHÔNG dùng KAFKA_HEAP_OPTS trực tiếp — entrypoint
            # đọc biến "HEAP_OPTS" (không tiền tố) rồi tự export thành
            # KAFKA_HEAP_OPTS cho JVM, verify qua source docker-entrypoint.sh.
            # Đặt nhầm tên (như kafka.yaml dùng KAFKA_HEAP_OPTS) sẽ bị bỏ qua
            # hoàn toàn, JVM tự đoán heap theo RAM host thấy được.
            - { name: HEAP_OPTS,                                  value: "-Xmx512m -Xms384m" }
          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits: { memory: "768Mi", cpu: "1000m" }
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: social
spec:
  selector: { app: kafka-connect }
  ports:
    - port: 8083

---
# Job chạy 1 lần để đăng ký PostgreSQL connector sau khi kafka-connect up
apiVersion: batch/v1
kind: Job
metadata:
  name: register-debezium-connector
  namespace: social
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-connect
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              until curl -sf http://kafka-connect:8083/connectors; do
                echo "Waiting for kafka-connect..."; sleep 5
              done
      containers:
        - name: register
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              curl -sf -X POST http://kafka-connect:8083/connectors \
                -H "Content-Type: application/json" \
                -d '{
                  "name": "social-outbox-connector",
                  "config": {
                    "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
                    "database.hostname": "postgres",
                    "database.port": "5432",
                    "database.user": "postgres",
                    "database.password": "postgres",
                    "database.dbname": "social",
                    "topic.prefix": "social",
                    "plugin.name": "pgoutput",
                    "table.include.list": "interaction.outbox,post.outbox,auth.outbox",
                    "transforms": "outbox",
                    "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
                    "transforms.outbox.table.field.event.id": "id",
                    "transforms.outbox.table.field.event.key": "aggregate_id",
                    "transforms.outbox.table.field.event.type": "event_type",
                    "transforms.outbox.table.field.event.payload": "payload",
                    "transforms.outbox.table.expand.json.payload": "true",
                    "transforms.outbox.route.by.field": "aggregate_type",
                    "transforms.outbox.route.topic.replacement": "social.${routedByValue}",
                    "tombstones.on.delete": "false"
                  }
                }'
              echo "Connector registered"
