# File này KHÔNG chứa key thật — tạo Secret bằng lệnh trong Makefile:
#
#   make k8s-secrets
#
# hoặc thủ công:
#
#   kubectl create secret generic jwt-keys \
#     --from-file=private-key.pem=services/dev-private.pem \
#     --from-file=public-key.pem=services/dev-public.pem \
#     -n social
#
# Secret sẽ được mount vào /etc/jwt/ trong mỗi container.
