apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: social
spec:
  replicas: 1
  selector:
    matchLabels: { app: localstack }
  template:
    metadata:
      labels: { app: localstack }
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3
          env:
            - { name: SERVICES,       value: s3 }
            - { name: DEFAULT_REGION, value: us-east-1 }
          ports:
            - containerPort: 4566

---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: social
spec:
  selector: { app: localstack }
  ports:
    - port: 4566
