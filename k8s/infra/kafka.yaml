apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: social
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      # Service tên "kafka" khiến k8s tự tiêm KAFKA_PORT, trùng biến
      # deprecated-fatal của cp-kafka — xem tracking.md.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          env:
            - { name: KAFKA_NODE_ID,                              value: "1" }
            - { name: KAFKA_PROCESS_ROLES,                        value: "broker,controller" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP,       value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_LISTENERS,                            value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS,                 value: PLAINTEXT://kafka:9092 }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES,            value: CONTROLLER }
            # localhost, không phải Service "kafka" — broker/controller cùng
            # 1 process, đi qua ClusterIP dính hairpin NAT trên kindnetd.
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS,             value: 1@localhost:9093 }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR,    value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE,            value: "true" }
            - { name: CLUSTER_ID,                                 value: MkU3OEVBNTcwNTJENDM2Qk }
            # Không set thì JVM tự tính heap theo RAM host thấy được, có thể
            # vượt xa mức pod thực sự được cấp (memory limit dưới) — ép rõ
            # ràng thay vì để JVM đoán. Kafka OOM-killed đã xảy ra 2 lần vì
            # thiếu cả heap cap lẫn pod-level limit — xem tracking.md.
            - { name: KAFKA_HEAP_OPTS,                            value: "-Xmx768m -Xms512m" }
          ports:
            - { name: plaintext,  containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits: { memory: "1Gi", cpu: "1000m" }
          readinessProbe:
            # KHÔNG dùng "kafka-topics --list" — client luôn redirect sang
            # advertised.listeners (kafka:9092, Service) sau bootstrap, dính
            # hairpin NAT y hệt bug KAFKA_CONTROLLER_QUORUM_VOTERS trước đó,
            # verify bằng cách chạy tay trong pod (treo >30s, xem tracking.md).
            # tcpSocket thuần network-level, không qua Kafka protocol nên
            # không bị redirect.
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: social
spec:
  selector: { app: kafka }
  ports:
    - { name: plaintext,  port: 9092 }
    - { name: controller, port: 9093 }
