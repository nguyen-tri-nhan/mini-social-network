apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: social
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [--maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
          ports:
            - containerPort: 6379
          # limit > maxmemory (256mb ở trên) — chừa đệm cho process overhead
          # + kết nối, không riêng phần data Redis tự giới hạn.
          resources:
            requests: { memory: "96Mi", cpu: "50m" }
            limits: { memory: "320Mi", cpu: "250m" }
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: social
spec:
  selector: { app: redis }
  ports:
    - port: 6379
