apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: social
data:
  init-schemas.sql: |
    CREATE SCHEMA IF NOT EXISTS auth;
    CREATE SCHEMA IF NOT EXISTS users;
    CREATE SCHEMA IF NOT EXISTS post;
    CREATE SCHEMA IF NOT EXISTS interaction;
    CREATE SCHEMA IF NOT EXISTS notification;

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: social
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          args:
            - -c
            - wal_level=logical           # required by Debezium CDC
            - -c
            - max_wal_senders=4
            - -c
            - max_replication_slots=4
          env:
            - { name: POSTGRES_DB,       value: social }
            - { name: POSTGRES_USER,     value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: social
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
