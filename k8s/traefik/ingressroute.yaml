---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-routes
  namespace: social
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/api/auth`)
      kind: Rule
      services:
        - name: auth-service
          port: 8080

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: protected-routes
  namespace: social
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/api/users`)
      kind: Rule
      services:
        - name: user-service
          port: 8080

    - match: PathPrefix(`/api/articles`)
      kind: Rule
      services:
        - name: post-service
          port: 8080

    - match: PathPrefix(`/api/comments`)
      kind: Rule
      services:
        - name: interaction-service
          port: 8080

    - match: PathPrefix(`/api/votes`)
      kind: Rule
      services:
        - name: interaction-service
          port: 8080

    - match: PathPrefix(`/api/notifications`)
      kind: Rule
      services:
        - name: notification-service
          port: 8080
