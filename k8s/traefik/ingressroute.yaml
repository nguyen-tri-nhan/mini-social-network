---
# Không dùng ForwardAuth ở gateway — mỗi service tự verify JWT cục bộ qua
# public key (mp.jwt.verify.publickey.location, xem application.properties
# từng service) + @RolesAllowed. Traefik chỉ route theo path.
# Lý do bỏ ForwardAuth: xem specs/decisions/0005.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: social-routes
  namespace: social
spec:
  entryPoints: [web]
  routes:

    # ── Public (no auth) ──────────────────────────────────────────────────────
    - match: PathPrefix(`/api/auth`)
      kind: Rule
      services:
        - name: auth-service
          port: 8080

    # ── Protected (mỗi service tự verify JWT) ──────────────────────────────────
    - match: PathPrefix(`/api/users`)
      kind: Rule
      services:
        - name: user-api
          port: 8080

    - match: PathPrefix(`/api/articles`)
      kind: Rule
      services:
        - name: post-api
          port: 8080

    - match: PathPrefix(`/api/comments`)
      kind: Rule
      services:
        - name: interaction-service
          port: 8080

    - match: PathPrefix(`/api/votes`)
      kind: Rule
      services:
        - name: interaction-service
          port: 8080

    - match: PathPrefix(`/api/notifications`)
      kind: Rule
      services:
        - name: notification-api
          port: 8080

    - match: PathPrefix(`/ws`)
      kind: Rule
      services:
        - name: websocket-service
          port: 8080

    # ── API Docs (Swagger UI gộp, public) — xem specs/decisions/0001 ────────────
    - match: PathPrefix(`/q`)
      kind: Rule
      services:
        - name: auth-service
          port: 8080

    - match: PathPrefix(`/openapi/users`)
      kind: Rule
      services:
        - name: user-api
          port: 8080

    - match: PathPrefix(`/openapi/post`)
      kind: Rule
      services:
        - name: post-api
          port: 8080

    - match: PathPrefix(`/openapi/interaction`)
      kind: Rule
      services:
        - name: interaction-service
          port: 8080

    - match: PathPrefix(`/openapi/notifications`)
      kind: Rule
      services:
        - name: notification-api
          port: 8080
